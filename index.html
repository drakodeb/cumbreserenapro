<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jardinería Rey | Jardines residenciales en Querétaro</title>
  <meta name="description" content="Jardinería Rey. Mantenimiento de jardines residenciales en Querétaro. Poda, limpieza, cuidado de plantas y sistemas de riego. Solicita tu cotización.">
  <meta name="theme-color" content="#123d2b">

  <style>
    :root {
      --green: #17683b;
      --green-dark: #103b29;
      --green-light: #eaf3eb;
      --text: #202c27;
      --muted: #647169;
      --white: #ffffff;
      --surface: #f7f9f6;
      --border: #e5ebe5;
      --radius: 16px;
      --width: 1160px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; scroll-padding-top: 90px; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      line-height: 1.65;
      background: var(--white);
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .container { width: min(var(--width), calc(100% - 40px)); margin-inline: auto; }
    .section { padding: 88px 0; }

    .eyebrow {
      color: var(--green);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1, h2, h3 { line-height: 1.2; letter-spacing: -.035em; }
    h1 { font-size: clamp(2.6rem, 5.5vw, 4.6rem); max-width: 680px; }
    h2 { font-size: clamp(2rem, 4vw, 2.8rem); }

    .section-heading { max-width: 650px; margin: 0 auto 48px; text-align: center; }
    .section-heading p { margin-top: 14px; color: var(--muted); }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 13px 23px;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { color: var(--white); background: var(--green); }
    .btn-primary:hover { background: #12552f; }
    .btn-outline { color: var(--white); border-color: rgba(255,255,255,.65); background: transparent; }
    .btn-outline:hover { background: rgba(255,255,255,.1); }

    .icon {
      width: 23px;
      height: 23px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Navegación */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .nav { min-height: 78px; display: flex; justify-content: space-between; align-items: center; gap: 25px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.45rem; font-weight: 850; letter-spacing: -.055em; }
    .brand-mark { display: grid; place-items: center; width: 43px; height: 43px; border-radius: 13px; color: var(--green); background: var(--green-light); }
    .brand-mark .icon { width: 28px; height: 28px; }
    .brand span { color: var(--green); }
    .brand small { display: block; color: var(--muted); font-size: .63rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 30px; font-size: .92rem; font-weight: 650; }
    .nav-links a:hover { color: var(--green); }
    .nav-toggle { display: none; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 8px; background: white; color: var(--green-dark); cursor: pointer; }

    /* Portada */
    .hero { position: relative; min-height: 610px; display: flex; align-items: center; overflow: hidden; color: white; background: var(--green-dark); }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(8,38,26,.92) 0%, rgba(8,38,26,.79) 42%, rgba(8,38,26,.20) 100%),
        url("https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=2000&q=85")
        center 52% / cover no-repeat;
    }
    .hero-content { position: relative; z-index: 1; padding-block: 100px; }
    .hero .eyebrow { color: #c1e8c5; }
    .hero p { max-width: 550px; margin: 22px 0 30px; color: #edf4ee; font-size: 1.1rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero-note { display: flex; align-items: center; gap: 9px; margin-top: 35px; font-size: .9rem; color: #e1eee3; }
    .hero-note .icon { color: #b7e8b9; }

    /* Servicios */
    .services { background: var(--surface); }
    .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .service-card { padding: 30px 26px; border: 1px solid var(--border); border-radius: var(--radius); background: white; transition: transform .2s, box-shadow .2s; }
    .service-card:hover { transform: translateY(-4px); box-shadow: 0 14px 35px rgba(20,65,37,.08); }
    .service-icon { display: grid; place-items: center; width: 54px; height: 54px; margin-bottom: 22px; border-radius: 14px; color: var(--green); background: var(--green-light); }
    .service-icon .icon { width: 28px; height: 28px; }
    .service-card h3 { font-size: 1.12rem; margin-bottom: 10px; }
    .service-card p { color: var(--muted); font-size: .94rem; }

    /* Presentación */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 65px; }
    .about-image { width: 100%; min-height: 440px; object-fit: cover; border-radius: var(--radius); background: var(--green-light); }
    .about-copy > p:not(.eyebrow) { margin-top: 20px; color: var(--muted); }
    .benefits { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .benefit { display: flex; gap: 12px; align-items: flex-start; font-weight: 650; font-size: .92rem; }
    .benefit .icon { color: var(--green); }

    /* Galería */
    .gallery { background: var(--surface); }
    .gallery-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; grid-template-rows: 230px 230px; gap: 16px; }
    .gallery-item { position: relative; overflow: hidden; border-radius: 13px; background: #dfe9df; }
    .gallery-item:first-child { grid-row: span 2; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .45s; }
    .gallery-item:hover img { transform: scale(1.05); }
    .gallery-caption { position: absolute; inset: auto 0 0; padding: 35px 18px 18px; color: white; font-weight: 700; background: linear-gradient(transparent, rgba(0,0,0,.68)); }

    /* Contacto */
    .contact { padding: 76px 0; color: white; background: var(--green-dark); }
    .contact-grid { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 35px; }
    .contact .eyebrow { color: #b9e3bf; }
    .contact h2 { max-width: 650px; }
    .contact p:not(.eyebrow) { max-width: 580px; margin-top: 14px; color: #dce9df; }
    .contact-actions { display: flex; flex-wrap: wrap; gap: 12px; }

    /* Pie */
    .footer { padding: 30px 0; background: #10271e; color: #e2ebe4; }
    .footer-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; padding-bottom: 24px; }
    .footer .brand { font-size: 1.1rem; }
    .footer .brand-mark { color: #c5e9c8; background: rgba(255,255,255,.1); }
    .footer .brand small { color: #c5d5c9; }
    .footer-location { display: flex; align-items: center; gap: 9px; font-size: .9rem; }
    .footer-location .icon { color: #b9e3bf; }
    .copyright { padding-top: 22px; border-top: 1px solid rgba(255,255,255,.16); color: #c1d0c5; font-size: .82rem; text-align: center; }

    /* Adaptación móvil */
    @media (max-width: 800px) {
      .nav { min-height: 70px; }
      .nav-toggle { display: grid; place-items: center; }
      .nav-links {
        display: none;
        position: absolute;
        top: 70px; left: 0; right: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 10px 20px 20px;
        border-bottom: 1px solid var(--border);
        background: white;
      }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 12px 5px; }
      .hero { min-height: 550px; }
      .hero::before {
        background:
          linear-gradient(90deg, rgba(8,38,26,.88), rgba(8,38,26,.55)),
          url("https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=1200&q=80")
          center / cover no-repeat;
      }
      .service-grid { grid-template-columns: repeat(2, 1fr); }
      .about-grid { grid-template-columns: 1fr; gap: 35px; }
      .about-image { min-height: 320px; max-height: 430px; }
      .gallery-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 230px 180px 180px; }
      .gallery-item:first-child { grid-column: span 2; grid-row: auto; }
      .contact-grid { grid-template-columns: 1fr; }
    }
